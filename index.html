<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yeshilin432 | 异世界入口</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ========== 开屏页：贤者之塔 ========== -->
    <div id="splash-screen">
        <!-- 粒子背景 -->
        <div class="particles" id="particles"></div>

        <!-- 塔的背景 -->
        <div class="tower-background">
            <div class="tower-silhouette"></div>
            <div class="magic-circles">
                <div class="magic-circle circle-1"></div>
                <div class="magic-circle circle-2"></div>
                <div class="magic-circle circle-3"></div>
            </div>
        </div>

        <!-- 自定义背景图（替换图片路径即可） -->
        <div class="bg-image-layer" id="bgImageLayer">
            <!-- 当用户提供图片时，通过 JS 设置 background-image -->
        </div>

        <!-- 进入按钮 -->
        <div class="enter-btn" id="enterBtn">
            <span>— 进入主页 —</span>
            <div class="enter-glow"></div>
        </div>

    </div>

    <!-- ========== 主页面 ========== -->
    <main id="main-content" class="hidden">
        <!-- 导航栏 -->
        <nav class="navbar" id="navbar">
            <div class="nav-brand">
                <span class="brand-icon"></span>
                <span class="brand-text">yeshilin432</span>
            </div>
            <div class="nav-links">
                <a href="#home" class="nav-link active" data-section="home">首页</a>
                <a href="#about" class="nav-link" data-section="about">关于</a>
                <a href="#projects" class="nav-link" data-section="projects">项目</a>
                <a href="#blog" class="nav-link" data-section="blog">博客</a>
                <a href="#contact" class="nav-link" data-section="contact">联系</a>
            </div>
            <div class="nav-mobile-btn" id="navMobileBtn">
                <span></span><span></span><span></span>
            </div>
        </nav>

        <!-- Hero 区域 -->
        <section id="home" class="section hero-section">
            <div class="hero-bg-effects">
                <div class="floating-orb orb-1"></div>
                <div class="floating-orb orb-2"></div>
                <div class="floating-orb orb-3"></div>
            </div>
